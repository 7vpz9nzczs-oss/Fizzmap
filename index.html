function brandStats(){let us=unique(),n=us.length;const mean=k=>n?(us.reduce((a,d)=>a+(Number.isFinite(d[k])?d[k]:0),0)/n).toFixed(1):'—';const hallCount=us.filter(hall).length;const kpis=`<div class="data-stats"><div><b>${mean('score')}</b><small>Ø TASTE / 10</small></div><div><b>${mean('sugar')}</b><small>Ø SUGAR / 100ml</small></div><div><b>${hallCount}</b><small>HALL ENTRIES</small></div></div>`;const make=kind=>{let counts={};for(const d of us){let k=d[kind]||'?';counts[k]=(counts[k]||0)+1}return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class="insight"><b>${esc(k)}</b><div class="bar"><i style="width:${v/Math.max(1,n)*100}%"></i></div><small>${v}</small></div>`).join('')||`<p class="muted">${tx('noData')}</p>`};return `<section class="section"><div class="section-title"><h2>${tx('stats')}<span class="lime">.</span></h2></div>${kpis}<div class="flat"><div class="key">${tx('brandStats')}</div>${make('maker')}<div class="key" style="margin-top:17px">${tx('countryStats')}</div>${make('country')}</div></section>`}

ld">${tx('original')} ${d.productPhoto?'<span class="lime">✓</span>':''}</label><input class="upload" type="file" data-image="productPhoto" accept="image/*"><label class="field">${tx('nutrition')} ${d.nutriPhoto?'<span class="lime">✓</span>':''}</label><input class="upload" type="file" data-image="nutriPhoto" accept="image/*"><label class="checkrow"><input type="checkbox" data-edit="sharePhoto" ${d.sharePhoto?'checked':''}> ${s.lang==='de'?'Mein Produktfoto für Community Shots freigeben':'Share my product photo with the crew'}</label><button class="cta" data-save style="width:100%;margin-top:19px">${tx('save')} ↗</button><p class="notice">${crew.enabled&&crew.user?crewMsg('Lokal gespeichert und bei Verbindung in die Crew synchronisiert. Bewahre zusätzlich JSON-Backups auf.','Saved locally and synced to the crew when connected. Keep JSON backups too.'):tx('local')}</p></div>`}

function normalize(d){if(!d||typeof d!=='object'||typeof d.name!=='string'||!d.name.trim())throw Error('Invalid drink');
 const ratingNames=['taste','refreshment','mouthfeel','balance','aftertaste','originality'];
 const rs=Array.isArray(d.ratings)?d.ratings.map(v=>Number(v)):ratingNames.map(k=>Number(d.ratings?.[k]??7));
 const score=Math.max(0,rs.reduce((sum,v,i)=>sum+Math.max(0,Math.min(10,v||0))*weights[i],0)-(Number(d.penalty)||0));

 const sugar=d.sugar===null||d.sugar===''||d.sugar===undefined?null:Number(d.sugar);
 const sweet=d.sweet==='no'||d.sweet==='yes'?d.sweet:(d.sweeteners===true?'yes':'unknown');
 return {id:String(d.id||'fizz-'+Date.now()+'-'+Math.random().toString(36).slice(2)),name:String(d.name).slice(0,120),brand:String(d.brand||'').slice(0,120),maker:String(d.maker||d.brand||''),country:String(d.country||d.origin||''),cat:String(d.cat||d.category||'Other'),sugar:Number.isFinite(sugar)?Math.max(0,Math.min(50,sugar)):null,size:Math.max(1,Math.min(5000,Number(d.size)||330)),sweet,pack:d.pack==='bottle'||d.packaging==='bottle'?'bottle':'can',color:/^#[0-9a-fA-F]{6}$/.test(d.color)?d.color:'#d8ff52',note:String(d.note||'').slice(0,5000),date:String(d.date||new Date().toISOString().slice(0,10)).slice(0,25),bought:String(d.bought||''),enjoyed:String(d.enjoyed||''),ratings:rs,score:(d.tasted===false||d.status==='wishlist')?null:Math.round((Array.isArray(d.ratings)||d.ratings&&typeof d.ratings==='object'?score:Number(d.score)||score)*10)/10,tasted:d.tasted!==undefined?Boolean(d.tasted):d.status!=='wishlist',art:safeImg(d.art)||safeImg(d.coverLabelPhoto)||null,productPhoto:safeImg(d.productPhoto)||safeImg(d.photo)||null,nutriPhoto:safeImg(d.nutriPhoto)||safeImg(d.labelPhoto)||null,zoom:Math.max(1,Math.min(2,Number(d.zoom||d.labelZoom)||1)),shift:Math.max(-50,Math.min(50,Number(d.shift??d.labelOffset)||0)),penalty:Math.max(0,Math.min(2,Number(d.penalty)||0)),catalogId:String(d.catalogId||''),labelName:String(d.labelName||''),market:String(d.market||''),productSource:String(d.productSource||''),verifiedSweetener:!!d.verifiedSweetener,verificationSource:String(d.verificationSource||''),sharePhoto:!!d.sharePhoto,sample:false};
}

function nativeTransfer(operation,content,name='',mime='',requestId=''){const id=requestId||'transfer-'+Date.now()+'-'+Math.random().toString(36).slice(2),size=300000,total=Math.max(1,Math.ceil(content.length/size));for(let index=0;index<total;index++){if(!sendNative({type:'chunk',operation,requestId:id,index,total,content:content.slice(index*size,(index+1)*size),name,mime}))throw Error('Native transfer failed')}return id}
async function openDatabase(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB unavailable'));const req=indexedDB.open('fizzmap_db',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('kv'))req.result.createObjectStore('kv')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbRead(){if(!db)return null;return new Promise((resolve,reject)=>{const req=db.transaction('kv','readonly').objectStore('kv').get('drinks');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbWrite(items){if(!db)return;return new Promise((resolve,reject)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(items,'drinks');tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function persist(){if(!storageReady)throw Error('Storage not ready');try{if(nativeBridge()){await new Promise((resolve,reject)=>{const id='save-'+Date.now()+'-'+Math.random().toString(36).slice(2);nativePending.set(id,{resolve,reject});nativeTransfer('save',JSON.stringify({app:'FIZZMAP',schema:2,drinks:s.items,lang:s.lang}),'','',id);setTimeout(()=>{if(nativePending.has(id)){nativePending.delete(id);reject(Error('Native save timed out'))}},10000)})}else if(db){await dbWrite(s.items)}else{localStorage.setItem('fizzmap_fallback_v2',JSON.stringify(s.items))}return true}catch(e){console.error('FIZZMAP save failed',e);toast(s.lang==='de'?'Speichern fehlgeschlagen – bitte Speicher prüfen.':'Save failed – check device storage.');return false}}
async function initialize(){try{const storedLang=localStorage.getItem('fizzmap.lang');if(storedLang==='en')s.lang='en'}catch(_){ }
 if(nativeBridge()){storageReady=true;render();sendNative({type:'ready'});return}
 try{db=await openDatabase();const previous=await dbRead();if(Array.isArray(previous))s.items=previous.filter(d=>!d.demo&&!d.sample).map(normalize);else{const fallback=localStorage.getItem('fizzmap_fallback_v2');if(fallback)s.items=JSON.parse(fallback).map(normalize)}storageReady=true;render()}catch(e){console.warn('IndexedDB unavailable',e);try{const fallback=localStorage.getItem('fizzmap_fallback_v2');if(fallback)s.items=JSON.parse(fallback).map(normalize);storageReady=true;render();toast('Fallback storage active')}catch(_){storageReady=true;render();toast('Storage unavailable: export before closing')}}}
window.FizzNative={saved:function(payload){const pending=nativePending.get(payload?.id);if(!pending)return;nativePending.delete(payload.id);payload.ok?pending.resolve(true):pending.reject(Error(payload.error||'Native save failed'))},restore:function(payload){try{if(payload?.drinks&&Array.isArray(payload.drinks))s.items=payload.drinks.map(normalize);if(payload?.lang==='en')s.lang='en';storageReady=true;render();toast(s.lang==='de'?`${s.items.length} Drinks geladen`:`${s.items.length} drinks loaded`)}catch(e){console.error(e)}},import:function(payload){restoreData(payload)}};
function csvSafe(v){let x=String(v??'');if(/^[=+@\t\r]/.test(x)||(/^-(?!\d+(?:[.,]\d+)?$)/.test(x)))x="'"+x;return '"'+x.replaceAll('"','""')+'"'}
function fullCSV(onlyMine=false){const columns=['record_type','id','name','brand','manufacturer','country','category','packaging','size_ml','sugar_g_per_100ml','sugar_g_per_package','sweeteners','taste_score','tasted','purchase_location','enjoyed_location','tasting_date','taste','refreshment','mouthfeel','balance','aftertaste','originality','sweetener_penalty','note','cover_photo','product_photo','nutrition_photo','catalog_product_id','recipe_market','official_product_source','sweetener_verified','verification_source','community_photo_consent','cloud_product_id'];const items=onlyMine?[...s.items]:[...data,...s.items];const rows=items.map(d=>[d.sample?'FICTIONAL_STUDIO':'PERSONAL',d.id,d.name,d.brand,d.maker,d.country,d.cat,d.pack,d.size,d.sugar??'',Number.isFinite(d.sugar)?(d.sugar*d.size/100).toFixed(2):'',d.sweet,d.score,d.tasted??'',d.bought||'',d.enjoyed||'',d.date||'',...(Array.isArray(d.ratings)?d.ratings:Array(6).fill('')),d.penalty||0,d.note||'',!!d.art,!!d.productPhoto,!!d.nutriPhoto,d.catalogId||'',d.market||'',d.productSource||'',!!d.verifiedSweetener,d.verificationSource||'',!!d.sharePhoto,d.cloudProductId||'']);const csv='\ufeff'+[columns,...rows].map(r=>r.map(csvSafe).join(';')).join('\r\n');if(csv.split('\r\n').length!==rows.length+1)throw Error('CSV row count mismatch');return {csv,rows:rows.length,personal:s.items.length,samples:onlyMine?0:data.length}}
function backup(){const obj={app:'FIZZMAP',schema:2,exportedAt:new Date().toISOString(),lang:s.lang,drinks:s.items,catalog:data.map(({art,...d})=>({...d,art}))};const json=JSON.stringify(obj,null,2);const test=JSON.parse(json);if(test.drinks.length!==s.items.length||test.catalog.length!==data.length)throw Error('Backup count mismatch');for(let i=0;i<s.items.length;i++)for(const key of ['art','productPhoto','nutriPhoto'])if((test.drinks[i][key]||null)!==(s.items[i][key]||null))throw Error('Photo missing from backup');return {json,drinks:test.drinks.length,catalog:test.catalog.length,photos:test.drinks.reduce((n,d)=>n+['art','productPhoto','nutriPhoto'].filter(k=>!!d[k]).length,0)}}
function downloadFile(name,content,mime){if(nativeBridge()){nativeTransfer('export',content,name,mime);return}const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportFile(kind){try{const stamp=new Date().toISOString().slice(0,10);if(kind==='json'){const b=backup();downloadFile('FIZZMAP_Full_Backup_'+stamp+'.json',b.json,'application/json');report(`${b.drinks} ${s.lang==='de'?'eigene Drinks':'personal drinks'} · ${b.catalog} Studio · ${b.photos} Fotos · JSON ✓`)}else{const r=fullCSV(kind==='mine');if(kind==='mine'&&!r.personal){toast(s.lang==='de'?'Noch keine eigenen Drinks. Nutze CSV / Alle Karten.':'No personal drinks yet. Use CSV / All cards.');return}downloadFile('FIZZMAP_'+(kind==='mine'?'My_Drinks':'Full_Index')+'_'+stamp+'.csv',r.csv,'text/csv;charset=utf-8');report(`${r.rows} ${s.lang==='de'?'Datensätze':'records'} (${r.personal} ${s.lang==='de'?'eigene':'personal'}, ${r.samples} Studio) · CSV ✓`)}}catch(e){console.error(e);toast('Export error: '+e.message)}}
async function restoreData(obj){try{if(!obj||obj.app!=='FIZZMAP'||![1,2].includes(Number(obj.schema))||!Array.isArray(obj.drinks)||obj.drinks.length>10000)throw Error('Not a valid FIZZMAP backup');const incoming=obj.drinks.filter(d=>!d.demo&&!d.sample).map(normalize);const ok=confirm(s.lang==='de'?`Backup mit ${incoming.length} eigenen Drinks importieren? Deine ${s.items.length} aktuellen Einträge werden ersetzt.`:`Import ${incoming.length} drinks? This replaces ${s.items.length} existing drinks.`);if(!ok)return;const old=s.items;s.items=incoming;if(!await persist()){s.items=old;return}nav('fridge');toast(`${incoming.length} ${s.lang==='de'?'Drinks wiederhergestellt':'drinks restored'} ✓`)}catch(e){toast((s.lang==='de'?'Import fehlgeschlagen: ':'Import failed: ')+e.message)}}
async function readPhoto(file){if(!file||!file.type.startsWith('image/'))throw Error('Please choose an image');if(file.size>28*1024*1024)throw Error('Image larger than 28 MB');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(Error('Cannot read image'));r.readAsDataURL(file)});return await new Promise(resolve=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.84))};img.onerror=()=>/^data:image\/(?:jpeg|png|webp);base64,/.test(data)?resolve(data):reject(Error('Fotoformat konnte nicht verarbeitet werden. Bitte JPEG oder PNG verwenden.'));img.src=data})}

const crew={enabled:false,client:null,user:null,members:[],products:[],tastings:[],global:[],legacyItems:[],connected:false,ready:false,error:'',busy:false,gateOpen:false,loginEmail:'',loginPassword:'',refreshing:false,lastRefresh:0,signing:null};
const crewConfig=window.FIZZMAP_CONFIG||{};
crew.enabled=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(crewConfig.url||'')&&/^[A-Za-z0-9_\-\.]{15,}$/.test(crewConfig.publishableKey||'');
const crewMsg=(de,en)=>s.lang==='de'?de:en;
const crewKey=(d)=>{
 const slug=v=>String(v||'').normalize('NFKD').toLowerCase().replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90);
 if(d.catalogId&&d.catalogId.startsWith('shared:')){const p=crew.products.find(p=>p.id===d.catalogId.slice(7));if(p)return p.product_key;}
 if(d.catalogId)return 'catalog:'+d.catalogId.slice(0,260);
 // The recipe market, sweetener status and sugar are part of identity: do not merge variants.
 return ('manual:'+slug(d.brand)+':'+slug(d.name)+':'+slug(d.market||d.country||'unknown')+':'+String(d.sugar??'unknown')+':'+String(d.sweet||'unknown')).slice(0,290);
};
function crewGallery(d){return (Array.isArray(d.communityPhotos)?d.communityPhotos:[]).filter(x=>typeof x==='string'&&/^https:\/\/[a-z0-9-]+\.supabase\.co\/storage\/v1\/object\/sign\//.test(x));}
async function crewLoadSDK(){if(window.supabase?.createClient)return window.supabase; if(!navigator.onLine)throw Error('Internet für die erste Anmeldung erforderlich.');
 return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';script.crossOrigin='anonymous';script.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(Error('Supabase SDK nicht geladen'));script.onerror=()=>reject(Error('Cloud-Bibliothek konnte nicht geladen werden'));document.head.appendChild(script);});}
function crewLocalPendingKey(){return 'fizzmap-crew-pending-'+(crew.user?.id||'none');}
function crewPending(){try{return JSON.parse(localStorage.getItem(crewLocalPendingKey())||'{"upserts":[],"deletes":[]}')}catch(_){return {upserts:[],deletes:[]}}}
function crewWritePending(v){try{localStorage.setItem(crewLocalPendingKey(),JSON.stringify(v))}catch(e){console.warn('Sync queue store',e)}}
function crewQueueSave(item){if(!crew.user)return;const q=crewPending();if(!q.upserts.includes(item.id))q.upserts.push(item.id);q.deletes=q.deletes.filter(k=>k!==crewKey(item));crewWritePending(q)}
function crewQueueDelete(item){if(!crew.user)return;const q=crewPending();q.upserts=q.upserts.filter(id=>id!==item.id);const key=crewKey(item);if(!q.deletes.includes(key))q.deletes.push(key);crewWritePending(q)}
function crewSortSamples(){return crew.enabled&&crew.user?s.items:[...data,...s.items]}

function crewPackProduct(p,group){
 const points=group.filter(v=>v.tasted&&Number.isFinite(Number(v.score)));
 if(!points.length)return null;
 const avg=points.reduce((n,v)=>n+Number(v.score),0)/points.length;
 const sugar=p.sugar_g_100ml===null?null:Number(p.sugar_g_100ml);
 return {id:'global:'+p.id,cloudProductId:p.id,productKey:p.product_key,name:p.name,brand:p.brand,maker:p.manufacturer||p.brand,country:p.recipe_market||'',market:p.recipe_market||'',cat:p.category||'Other',sugar,score:Math.round(avg*10)/10,count:points.length,sweet:p.sweetener_status||'unknown',verifiedSweetener:!!p.sweetener_verified||group.some(v=>!!v.verified_no_sweetener),pack:'can',size:330,tasted:true,aggregate:true,sample:false,art:null,productPhoto:null,nutriPhoto:null,communityPhotos:[],note:'',bought:'',enjoyed:'', color:'#d8ff52'};

function crewRebuildGlobal(){

 crew.global=crew.products.map(p=>crewPackProduct(p,by.get(p.id)||[])).filter(Boolean).sort((a,b)=>b.score-a.score);

async function crewSignImage(bucket,path){if(!path||!crew.client)return null;try{const {data,error}=await crew.client.storage.from(bucket).createSignedUrl(path,3600);if(error)throw error;return data.signedUrl;}catch(e){console.warn('Image link unavailable',e);return null}}
async function crewLoadPrivatePhoto(path){if(!path||!crew.client)return null;try{const {data,error}=await crew.client.storage.from('fizzmap-private').download(path);if(error)throw error;return await new Promise(resolve=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>resolve(null);rd.readAsDataURL(data)})}catch(e){console.warn('Personal photo unavailable',e);return null}}
async function crewRefresh(silent=false){
 if(!crew.client||!crew.user||crew.refreshing)return;
 crew.refreshing=true;
 try{
  const sb=crew.client;
  const [mr,pr,tr,pvr]=await Promise.all([
    sb.from('fizzmap_members').select('user_id,display_name,active').limit(200),
    sb.from('fizzmap_products').select('*').order('created_at',{ascending:false}).limit(10000),
    sb.from('fizzmap_tastings').select('id,user_id,product_id,score,tasted,verified_no_sweetener,community_photo_path,updated_at').limit(20000),
    sb.from('fizzmap_private_tastings').select('user_id,product_id,payload,updated_at').eq('user_id',crew.user.id).limit(10000)
  ]);
  for(const resp of [mr,pr,tr,pvr])if(resp.error)throw resp.error;
  crew.members=mr.data||[];crew.products=pr.data||[];crew.tastings=tr.data||[];
  const productsById=new Map(crew.products.map(p=>[p.id,p]));
  const ownPublic=new Map(crew.tastings.filter(t=>t.user_id===crew.user.id).map(t=>[t.product_id,t]));
  const preservePending=new Map(s.items.filter(d=>crewPending().upserts.includes(d.id)).map(d=>[d.id,d]));
  const own=[];
  for(const row of pvr.data||[]){
   const p=productsById.get(row.product_id);if(!p)continue;
   const pub=ownPublic.get(p.id),raw=row.payload||{};
   const d=normalize({...raw,id:raw.local_id||raw.id||('cloud:'+p.id),name:p.name,brand:p.brand,maker:p.manufacturer,market:p.recipe_market,cat:p.category,sugar:p.sugar_g_100ml===null?null:Number(p.sugar_g_100ml),sweet:p.sweetener_status,score:pub?.score??null,tasted:pub?.tasted??raw.tasted});
   d.cloudProductId=p.id;d.catalogId=raw.catalogId||p.source_catalog_id||'';d.verifiedSweetener=Boolean(raw.verifiedSweetener||p.sweetener_verified);d.verificationSource=raw.verificationSource||'';
   const paths=raw.photoPaths||{};
   for(const field of ['art','productPhoto','nutriPhoto'])if(paths[field])d[field]=await crewLoadPrivatePhoto(paths[field]);
   own.push(d);
  }
  const ownIds=new Set(own.map(d=>d.id));
  for(const [id,d] of preservePending)if(!ownIds.has(id))own.push(d);else{let i=own.findIndex(x=>x.id===id);own[i]=d;}
  s.items=own;
  if(storageReady)await persist();
  crewRebuildGlobal();
  // Only photos explicitly shared with the crew are shown in the gallery.
  const photosByProduct=new Map();
  for(const r of crew.tastings){if(!r.community_photo_path)continue;const src=await crewSignImage('fizzmap-community',r.community_photo_path);if(src){const list=photosByProduct.get(r.product_id)||[];list.push(src);photosByProduct.set(r.product_id,list)}}
  for(const d of crew.global)d.communityPhotos=photosByProduct.get(d.cloudProductId)||[];
  crew.lastRefresh=Date.now();crew.connected=true;crew.error='';
  try{localStorage.setItem('fizzmap-crew-global-v1',JSON.stringify(crew.global.map(({art,productPhoto,nutriPhoto,communityPhotos,...d})=>({...d,communityPhotos:[]}))))}catch(_){}
  if(!silent){render(true);toast(crewMsg('Global aktualisiert ✓','Global updated ✓'))}else render(true);
 }catch(e){crew.error=e.message||String(e);crew.connected=false;console.warn('FIZZMAP sync refresh',e);if(!silent)toast('Sync: '+crew.error)}
 finally{crew.refreshing=false}
}
async function crewPhotoBlob(dataUrl){const res=await fetch(dataUrl);return await res.blob()}
async function crewPhotoPath(blob,productId,field){const buff=await blob.arrayBuffer();const hash=await crypto.subtle.digest('SHA-256',buff);const hx=Array.from(new Uint8Array(hash)).map(v=>v.toString(16).padStart(2,'0')).join('').slice(0,16);const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';return `${crew.user.id}/${productId}/${field}-${hx}.${ext}`;}
async function crewUploadPhotos(item,productId){const paths={};for(const field of ['art','productPhoto','nutriPhoto']){let val=item[field];if(typeof val!=='string'||!val.startsWith('data:image/'))continue;
  const blob=await crewPhotoBlob(val);if(blob.size>5*1024*1024)throw Error('Photo exceeds 5 MB');
  const path=await crewPhotoPath(blob,productId,field);
  const {error}=await crew.client.storage.from('fizzmap-private').upload(path,blob,{upsert:true,contentType:blob.type});if(error)throw error;paths[field]=path;
 }
 let communityPhotoPath=null;
 if(item.sharePhoto&&typeof item.productPhoto==='string'&&item.productPhoto.startsWith('data:image/')){
  const blob=await crewPhotoBlob(item.productPhoto);const path=await crewPhotoPath(blob,productId,'community');
  const {error}=await crew.client.storage.from('fizzmap-community').upload(path,blob,{upsert:true,contentType:blob.type});if(error)throw error;communityPhotoPath=path;
 }
 return {paths,communityPhotoPath};
}
async function crewResolveProduct(item){
 const sb=crew.client,productKey=crewKey(item);
 let p=crew.products.find(p=>p.product_key===productKey);
 if(p)return p;
 let {data:found,error}=await sb.from('fizzmap_products').select('*').eq('product_key',productKey).maybeSingle();if(error)throw error;
 if(found){crew.products.unshift(found);return found}
 const record={product_key:productKey,name:item.name,brand:item.brand||item.maker||'Unknown',manufacturer:item.maker||'',recipe_market:item.market||'',category:item.cat||'Other',sugar_g_100ml:item.sugar,sweetener_status:item.sweet||'unknown',sweetener_verified:item.sweet==='no'&&!!item.verifiedSweetener&&(!!item.nutriPhoto||item.verificationSource==='manufacturer_ingredient_list'||item.verificationSource==='shared_verified'),source_catalog_id:item.catalogId||null,source_url:item.productSource||null,created_by:crew.user.id};
 const ins=await sb.from('fizzmap_products').insert(record).select('*').single();
 if(ins.error){if(ins.error.code==='23505'){const again=await sb.from('fizzmap_products').select('*').eq('product_key',productKey).single();if(again.error)throw again.error;found=again.data}else throw ins.error;}else found=ins.data;
 crew.products.unshift(found);return found;
}
async function crewSyncOne(item){

 const prior=await sb.from('fizzmap_private_tastings').select('payload').eq('user_id',crew.user.id).eq('product_id',p.id).maybeSingle();if(prior.error)throw prior.error;
 const old=await sb.from('fizzmap_tastings').select('community_photo_path').eq('user_id',crew.user.id).eq('product_id',p.id).maybeSingle();if(old.error)throw old.error;
 const publicRow={user_id:crew.user.id,product_id:p.id,score:item.tasted?item.score:null,tasted:!!item.tasted,verified_no_sweetener:item.sweet==='no'&&!!item.verifiedSweetener&&(!!item.nutriPhoto||item.verificationSource==='manufacturer_ingredient_list'||item.verificationSource==='shared_verified'),community_photo_path:imgs.communityPhotoPath,updated_at:new Date().toISOString()};

 const payload={...item,local_id:item.id,photoPaths:imgs.paths};for(const k of ['art','productPhoto','nutriPhoto'])delete payload[k];

 const sr=await sb.from('fizzmap_private_tastings').upsert(secretRow,{onConflict:'user_id,product_id'});if(sr.error)throw sr.error;
 const oldPaths=prior.data?.payload?.photoPaths||{};const stale=['art','productPhoto','nutriPhoto'].map(k=>oldPaths[k]).filter(path=>path&&!Object.values(imgs.paths).includes(path));if(stale.length){const rm=await sb.storage.from('fizzmap-private').remove(stale);if(rm.error)console.warn('Old private photo cleanup',rm.error);}
 if(old.data?.community_photo_path&&old.data.community_photo_path!==imgs.communityPhotoPath){
   const rm=await sb.storage.from('fizzmap-community').remove([old.data.community_photo_path]);if(rm.error)console.warn('Old photo removal failed',rm.error);
 }
 item.cloudProductId=p.id;
}
async function crewSyncDelete(productKey){
 const p=crew.products.find(p=>p.product_key===productKey);if(!p)return;
 const sb=crew.client;
 const old=await sb.from('fizzmap_tastings').select('community_photo_path').eq('user_id',crew.user.id).eq('product_id',p.id).maybeSingle();

 if(old.data?.community_photo_path)await sb.storage.from('fizzmap-community').remove([old.data.community_photo_path]);

async function crewFlush(){if(!crew.user||!navigator.onLine||crew.busy)return;crew.busy=true;let done=0;
 try{const q=crewPending();for(const key of [...q.deletes]){await crewSyncDelete(key);q.deletes=q.deletes.filter(k=>k!==key);crewWritePending(q);done++;}
 for(const id of [...q.upserts]){const item=s.items.find(v=>v.id===id);if(!item){q.upserts=q.upserts.filter(v=>v!==id);crewWritePending(q);continue;}await crewSyncOne(item);q.upserts=q.upserts.filter(v=>v!==id);crewWritePending(q);done++;}
 if(done)await crewRefresh(true);
 }catch(e){crew.error=e.message||String(e);console.error('FIZZMAP cloud upload',e);toast('Sync pending: '+crew.error)}finally{crew.busy=false;crewStatusBadge()}
}
async function crewOnLocalSave(item){if(!crew.enabled||!crew.user)return;crewQueueSave(item);crewStatusBadge();if(navigator.onLine)await crewFlush();}
async function crewOnLocalDelete(item){if(!crew.enabled||!crew.user)return;crewQueueDelete(item);crewStatusBadge();if(navigator.onLine)await crewFlush();}
function crewStatusBadge(){const target=R.querySelector('#fz-crew-chip');if(!target)return;const n=crew.user?crewDisplayName(crew.user.id):'SIGN IN';const q=crew.user?crewPending():{upserts:[],deletes:[]};target.textContent=(crew.connected?'● ':'◌ ')+n.split(' ')[0]+(q.upserts.length+q.deletes.length?' · ↻':'');}
function crewGateHTML(){const isGerman=s.lang==='de';return `<div class="fz-crew-gate"><div class="fz-crew-splash"><div class="fz-crew-asterisk">✳</div><div class="fz-crew-kicker">FIZZMAP® / THE INNER CIRCLE</div><h1>YOUR CREW.<br><span>YOUR TASTE.</span></h1>${crew.user&&!crew.members.find(m=>m.user_id===crew.user.id)?`<p>${crewMsg('Account angemeldet. Der Zugang wird vom Club-Administrator freigegeben.','Signed in. Awaiting approval from your crew administrator.')}</p><button class="fz-crew-btn" data-crew-logout>LOG OUT</button>`:`<p>${crewMsg('Private Zugänge. Gemeinsamer Geschmack.','Private access. Shared taste.')}</p><form id="fz-crew-login"><label>E-MAIL<input type="email" name="email" autocomplete="email" required placeholder="you@example.com" value="${esc(crew.loginEmail)}"></label><label>PASSWORD<input type="password" name="password" autocomplete="current-password" required minlength="6"></label><button type="submit" class="fz-crew-btn">${crewMsg('ANMELDEN →','SIGN IN →')}</button></form><p class="fz-crew-foot">${crewMsg('Zugang nur auf Einladung.','Invitation only.')}</p>`}${crew.error?`<p class="fz-crew-error">${esc(crew.error)}</p>`:''}</div></div>`}
function crewRenderGate(){let gate=R.querySelector('.fz-crew-gate');if(!crew.enabled){gate?.remove();return;}const isMember=!!crew.members.find(m=>m.user_id===crew.user?.id&&m.active);const needsGate=!crew.user||!isMember;
 if(needsGate){if(gate)gate.outerHTML=crewGateHTML();else R.insertAdjacentHTML('beforeend',crewGateHTML());}else gate?.remove();crewStatusBadge();}
function crewAccountUI(){if(!crew.enabled)return '';const pending=crew.user?crewPending():{upserts:[],deletes:[]};const legacy=crew.legacyItems.filter(d=>!s.items.some(x=>crewKey(x)===crewKey(d)));
 return `<section class="section"><div class="section-title"><h2>FIZZMAP <span class="lime">ACCOUNT.</span></h2><span class="pill">PRIVATE GLOBAL</span></div><div class="fz-crew-panel"><div class="key">THE INNER CIRCLE</div><h3>${esc(crewDisplayName(crew.user?.id))}</h3><p class="muted">${crewMsg('Du besitzt deinen Fridge. Global kombiniert die Bewertungen deiner Crew.','Your fridge is yours. Global combines the scores of your crew.')}</p><div class="fz-crew-stats"><div><b>${crew.members.length}</b><small>MEMBERS</small></div><div><b>${crew.products.length}</b><small>DRINKS</small></div><div><b>${crew.tastings.length}</b><small>TASTINGS</small></div></div><p class="fine">${crew.connected?'● CLOUD CONNECTED':'◌ OFFLINE / LAST SYNC'} · ${pending.upserts.length+pending.deletes.length} PENDING</p><div class="fz-crew-actions"><button class="cta ghost" data-crew-refresh>↻ SYNC</button><button class="cta ghost" data-crew-logout>LOG OUT</button></div>${legacy.length?`<div class="fz-crew-migrate"><strong>${legacy.length} ${crewMsg('lokale Drinks gefunden','local drinks found')}</strong><p class="muted">${crewMsg('Nur auf deine ausdrückliche Freigabe werden sie für deinen Fridge und den gemeinsamen Katalog übernommen.','Import them into your private fridge and shared product index only if you choose.')}</p><button class="cta" data-crew-import>IMPORT ${legacy.length} DRINKS</button></div>`:''}<div class="fz-crew-migrate"><label class="field">PASSWORD</label><input class="input" type="password" id="fz-crew-new-password" minlength="8" autocomplete="new-password" placeholder="${crewMsg('Neues Passwort festlegen','Set a new password')}"><button class="cta ghost" data-crew-password>${crewMsg('PASSWORT SETZEN','SET PASSWORD')}</button></div></div></section>`;
}
async function crewAcceptSession(session){if(!session?.user)return;if(crew.signing===session.user.id)return;crew.signing=session.user.id;try{const old=crew.user?.id;
 crew.user=session.user;crew.loginEmail=session.user.email||crew.loginEmail;
 if(old===crew.user.id&&crew.connected){crewRenderGate();return;}
 try{const {data:members,error}=await crew.client.from('fizzmap_members').select('user_id,display_name,active').limit(100);if(error)throw error;crew.members=members||[];
 if(!crew.members.some(m=>m.user_id===crew.user.id&&m.active)){crew.error='';crew.connected=false;crewRenderGate();return;}
 crew.error='';const knownOwner=localStorage.getItem('fizzmap-crew-owner-v1');crew.legacyItems=knownOwner?[]:[...s.items];
 await crewRefresh(true);if(crew.connected){localStorage.setItem('fizzmap-crew-owner-v1',crew.user.id);localStorage.setItem('fizzmap-crew-last-member-v1',JSON.stringify({id:crew.user.id,display_name:crewDisplayName(crew.user.id)}));}crewRenderGate();await crewFlush();
 }catch(e){crew.error=e.message;crewRenderGate()}
 }finally{crew.signing=null;}
}
async function crewStart(){if(!crew.enabled)return;
 crew.error='';crew.ready=false;crewRenderGate();
 try{const lib=await crewLoadSDK();crew.client=lib.createClient(crewConfig.url.replace(/\/$/,''),crewConfig.publishableKey,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
  crew.client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){crew.user=null;crew.members=[];crew.global=[];crew.connected=false;s.items=[];crewRenderGate();return;}if(session?.user&&(event==='SIGNED_IN'||event==='PASSWORD_RECOVERY')){Promise.resolve().then(()=>crewAcceptSession(session));}});
  const {data:{session},error}=await crew.client.auth.getSession();if(error)throw error;
  if(session)await crewAcceptSession(session);
 }catch(e){crew.error=e.message||String(e);console.warn('Crew init',e);if(!navigator.onLine){try{const last=JSON.parse(localStorage.getItem('fizzmap-crew-last-member-v1')||'null');if(last?.id){crew.user={id:last.id};crew.members=[{user_id:last.id,display_name:last.display_name,active:true}];crew.global=JSON.parse(localStorage.getItem('fizzmap-crew-global-v1')||'[]');crew.connected=false;crew.error='';render();}}catch(_){}}}finally{crew.ready=true;crewRenderGate()}
}
R.addEventListener('submit',async e=>{if(e.target.id!=='fz-crew-login')return;e.preventDefault();if(!crew.client)return toast('Cloud not available');
 const form=e.target;const email=form.elements.email.value.trim(),pass=form.elements.password.value;crew.loginEmail=email;
 const submit=form.querySelector('button[type="submit"]');submit.disabled=true;
 try{const {data,error}=await crew.client.auth.signInWithPassword({email,password:pass});if(error)throw error;await crewAcceptSession(data.session);}catch(err){crew.error=err.message;crewRenderGate()}finally{submit.disabled=false;}
});
R.addEventListener('click',async e=>{let b=e.target.closest('[data-crew-refresh],[data-crew-logout],[data-crew-import],[data-crew-password],[data-account]');if(!b)return;
 if('account'in b.dataset){nav('me');return;}
 if('crewRefresh'in b.dataset){await crewFlush();await crewRefresh();return;}
 if('crewLogout'in b.dataset){if(!crew.client)return;const {error}=await crew.client.auth.signOut();if(error)toast(error.message);else{crew.user=null;crew.members=[];crew.global=[];crew.connected=false;s.items=[];crewRenderGate()};return;}
 if('crewPassword'in b.dataset){const pwd=R.querySelector('#fz-crew-new-password')?.value||'';if(pwd.length<8)return toast('Use at least 8 characters');const {error}=await crew.client.auth.updateUser({password:pwd});toast(error?error.message:'PASSWORD UPDATED ✓');return;}
 if('crewImport'in b.dataset){const items=crew.legacyItems.filter(d=>!s.items.some(x=>crewKey(x)===crewKey(d)));if(!items.length)return;if(!confirm(crewMsg(`${items.length} lokale Drinks deinem Account zuordnen und in den gemeinsamen Katalog aufnehmen?`, `Import ${items.length} drinks into your account and shared product index?`)))return;
  for(const d of items){const item=normalize(d);s.items.push(item);crewQueueSave(item);}crew.legacyItems=[];await persist();await crewFlush();render();return;
 }
});
window.addEventListener('online',()=>{if(!crew.client){crewStart();return;}if(crew.user){crewFlush().then(()=>crewRefresh(true));}});
window.addEventListener('focus',()=>{if(crew.user&&Date.now()-crew.lastRefresh>60000)crewRefresh(true)});
setInterval(()=>{if(crew.user&&navigator.onLine&&Date.now()-crew.lastRefresh>90000)crewRefresh(true)},95000);
// ===== END FIZZMAP CREW MODULE =====

function render(keep=false){let top=M.scrollTop;M.innerHTML=s.detail?detail():s.tab==='edit'?editor():s.tab==='map'?mapPage():s.tab==='fridge'?fridge():s.tab==='me'?myFizz():s.tab==='swap'?compare():s.tab==='manifesto'?manifesto():home();M.scrollTop=keep?top:0;R.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===s.lang));R.querySelectorAll('[data-nav]').forEach(b=>{let on=s.tab===b.dataset.nav;b.classList.toggle('active',on);let small=b.querySelector('small');if(small)small.textContent=tx(b.dataset.nav)});const chip=R.querySelector('#fz-crew-chip');if(chip)chip.hidden=!crew.enabled;crewRenderGate()}
function nav(x){s.tab=x;s.detail=null;s.peek=null;render(false)}
R.addEventListener('click',async e=>{let b=e.target.closest('[data-nav],[data-lang],[data-feature],[data-detail],[data-point],[data-close],[data-mode],[data-filter],[data-add],[data-back],[data-pack],[data-save],[data-set],[data-export],[data-import],[data-edititem],[data-deleteitem],[data-pickproduct]');if(!b)return;let d=b.dataset;
if(d.pickproduct){const product=FZ_PRODUCT_INDEX.find(p=>p.id===d.pickproduct);if(product&&s.edit){
  s.edit.name=product.name;s.edit.brand=product.brand;s.edit.maker=product.manufacturer;
  s.edit.cat=product.category;s.edit.market=product.market;s.edit.country=s.edit.country||'';
  s.edit.sugar=product.sugar_g_100ml;s.edit.sweet=product.sweetener_status;
  s.edit.catalogId=product.id;s.edit.labelName=product.name.toLowerCase().startsWith(product.brand.toLowerCase()+' ')?product.name.slice(product.brand.length+1):product.name;s.edit.productSource=product.source_url;s.edit.verificationSource=product.sweetener_verification==='manufacturer_ingredient_list'?'manufacturer_ingredient_list':product.id.startsWith('shared:')&&product.sweetener_verification==='shared_verified'?'shared_verified':'';s.edit.verifiedSweetener=product.sweetener_status==='no'&&!!s.edit.verificationSource;
  s.catalogQuery='';render(true);
  toast(s.lang==='de'?'Produktdaten übernommen. Eigene Verpackung prüfen.':'Product facts loaded. Verify your own label.');
}return}
if(d.export){exportFile(d.export);return}if('import'in d){R.querySelector('#fizz-import')?.click();return}if(d.edititem){let target=s.items.find(x=>x.id===d.edititem);if(target){s.edit=JSON.parse(JSON.stringify(target));s.detail=null;nav('edit')}return}if(d.deleteitem){let target=s.items.find(x=>x.id===d.deleteitem);if(target&&confirm((s.lang==='de'?'Drink wirklich löschen? ':'Delete drink? ')+target.name)){const previous=s.items;s.items=s.items.filter(x=>x.id!==target.id);if(await persist()){nav('fridge');await crewOnLocalDelete(target)}else{s.items=previous}}return}if(d.nav){nav(d.nav);return}if(d.lang){s.lang=d.lang;try{localStorage.setItem('fizzmap.lang',s.lang)}catch(_){}if(nativeBridge())sendNative({type:'language',lang:s.lang});render(true);return}if(d.feature){nav(d.feature==='swap'?'swap':'manifesto');return}if(d.detail){s.detail=d.detail;s.peek=null;render(false);return}if(d.point){s.peek=d.point;render(true);return}if('close' in d){s.peek=null;render(true);return}if(d.mode){s.mode=d.mode;s.peek=null;render(true);return}if(d.filter){s.filter=d.filter;render(true);return}if('back'in d){s.detail=null;nav('fridge');return}if('add'in d){s.catalogQuery='';s.edit={id:null,name:'',brand:'',maker:'',country:'',market:'',catalogId:'',productSource:'',verifiedSweetener:false,verificationSource:'',sharePhoto:false,cat:'Citrus',sugar:null,size:330,score:7.5,sweet:'unknown',bought:'',enjoyed:'',date:new Date().toISOString().slice(0,10),pack:'can',ratings:[8,8,8,8,8,8],tasted:true,art:null,productPhoto:null,nutriPhoto:null,zoom:1,shift:0,penalty:0,note:''};nav('edit');return}if(d.pack){s.edit.pack=d.pack;render(true);return}if(d.set){let r=R.querySelector('#fz5-set');if(r)r.innerHTML=`<p class="muted" style="margin-top:12px">${sets.find(v=>v[0]===d.set)?.[1]} ${d.set} / +20 XP · ${s.lang==='de'?'Einmaliger Bonus für die erste echte Verkostung aus dieser Geschmackswelt.':'One-time bonus for your first real tasting in this flavor world.'}</p>`;return}if('save'in d){if(!s.edit.name.trim()){R.querySelector('[data-edit="name"]')?.focus();return}let scores=getScore();const item=normalize({...s.edit,id:s.edit.id||'fizz-'+(crypto.randomUUID?.()||Date.now()),score:Math.round(scores*10)/10,sample:false});const old=s.items;const priorItem=s.items.find(x=>x.id===item.id);if(priorItem&&crew.enabled&&crew.user&&crewKey(priorItem)!==crewKey(item))crewQueueDelete(priorItem);s.items=[...s.items.filter(x=>x.id!==item.id),item];if(await persist()){nav('fridge');toast(s.lang==='de'?'Drink & Fotos gespeichert ✓':'Drink & photos saved ✓');await crewOnLocalSave(item)}else{s.items=old}return}});
R.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-point')){e.preventDefault();s.peek=e.target.dataset.point;render(true)}});
R.addEventListener('input',e=>{if(e.target.id==='fz-product-search'){s.catalogQuery=e.target.value;const area=R.querySelector('#fz-product-results');if(area)area.innerHTML=fzCatalogResults(s.catalogQuery);return}let k=e.target.dataset.edit;if(k){s.edit[k]=k==='tasted'?e.target.checked:k==='sugar'?(e.target.value.trim()===''?null:Number(e.target.value)):['size','zoom','shift','penalty'].includes(k)?Number(e.target.value):e.target.value;if(k==='name'&&s.edit.catalogId){s.edit.catalogId='';s.edit.labelName='';s.edit.productSource=''}const l=R.querySelector(`[data-val="${k}"]`);if(l)l.textContent=e.target.value;if(k==='zoom'||k==='shift'){let p=R.querySelector('.detail-photo .vessel');if(p)p.style.setProperty(k==='zoom'?'--label-zoom':'--label-shift',e.target.value+(k==='shift'?'%':''))}if((k==='name'||k==='brand')&&!s.edit.art){let label=R.querySelector('.detail-photo .label-design');if(label)label.innerHTML=`<span class="label-brand">${esc(s.edit.brand||'SODA CULTURE')}</span><strong>${esc(s.edit.name||'NEW DROP')}</strong><span class="label-caption">FIZZMAP®</span>`}return}if(e.target.hasAttribute('data-rating')){const i=+e.target.dataset.rating;s.edit.ratings[i]=+e.target.value;R.querySelector(`[data-rating-label="${i}"]`).textContent=e.target.value;R.querySelector('#fz5-score').textContent=getScore().toFixed(1);return}if(e.target.hasAttribute('data-query')){let pos=e.target.selectionStart;s.q=e.target.value;render(true);let input=R.querySelector('[data-query]');input?.focus();try{input?.setSelectionRange(pos,pos)}catch(_){}return}});
R.addEventListener('change',async e=>{if(e.target.id==='fizz-import'&&e.target.files?.[0]){try{const txt=await e.target.files[0].text();await restoreData(JSON.parse(txt))}catch(err){toast('Import error: '+err.message)}e.target.value='';return}if(e.target.hasAttribute('data-sort')){s.sort=e.target.value;render(true);return}if(e.target.dataset.image||e.target.id==='fz5-community'){try{const photo=await readPhoto(e.target.files?.[0]);if(e.target.id==='fz5-community'){s.shot=photo;render(true)}else{s.edit[e.target.dataset.image]=photo;if(e.target.dataset.image==='art'){const label=R.querySelector('.detail-photo .vessel-label');if(label)label.innerHTML='<img class="label-art" src="'+photo+'" alt="">'}const status=e.target.closest('label')?.previousElementSibling;toast(s.lang==='de'?'Bild für Karte übernommen ✓':'Image added to card ✓')}}catch(err){toast(err.message)}}});

initialize().then(()=>crewStart());
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js?v=6.3.0').catch(console.warn);
})();
