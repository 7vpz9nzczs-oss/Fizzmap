function fz65CubeBar(sugar,portion){const amount=sugar*portion/100,units=amount/3,whole=Math.floor(units),frac=units-whole,show=Math.min(36,Math.ceil(units));let html='<div class="fz65-cubes" role="img" aria-label="'+fzFormatNum(units)+' Zuckerwürfel zu je drei Gramm">';for(let i=0;i<show;i++){let f=i<whole?1:Math.max(.02,frac);html+=`<i class="fz65-cube" style="--cube-fill:${Math.round(f*100)}%" aria-hidden="true"></i>`}if(units>show)html+=`<b>+${Math.ceil(units)-show}</b>`;return html+'</div>'}

function manifesto(){return `<div class="pad fz65-manifesto"><button class="back" data-nav="home">← ${tx('back')}</button><div class="key" style="margin-top:20px">${s.lang==='de'?'DIE FIZZMAP-FORDERUNG':'THE FIZZMAP CHALLENGE'}</div><h1>${s.lang==='de'?'WENIGER ZUCKER.<br><span class="lime">KEINE AUSREDEN.</span>':'LESS SUGAR.<br><span class="lime">NO EXCUSES.</span>'}</h1><p class="lead">${s.lang==='de'?'Wir haben die Daten. Ihr habt den Geschmack. Die Hersteller haben das Rezept. Höchste Zeit, dass sich alle drei mal kennenlernen.':'We have the numbers. You have the taste. The makers have the recipes. Time to talk.'}</p>
 <div class="fz65-manifesto-lead"><h2>${s.lang==='de'?'Eine Dose ist kein Freifahrtschein.':'A can is not a free pass.'}</h2><p>${s.lang==='de'?'Zucker macht vieles einfach. Die eigentliche Kunst ist ein Drink, der auch ohne Zuckerlawine begeistert. Wir sind nicht gegen Genuss. Wir sind gegen langweilige Ausreden auf der Zutatenliste.':'Sugar makes things easy. Great flavor with less sugar takes more effort. We like pleasure, not lazy recipes.'}</p></div>

 <div class="fz65-manifesto-lead"><h2>${s.lang==='de'?'Unsere Regeln? Nicht käuflich.':'Our rules? Not for sale.'}</h2><p>${s.lang==='de'?'Der Zuckergehalt ist eine Zahl vom Etikett. Die Geschmackswertung kommt von Menschen. Die Hall of Fame verlangt beides: maximal 5 g Zucker je 100 ml, mindestens 8/10 Geschmack – und einen geprüften Nachweis, dass keine Süßstoffe enthalten sind. „Wenig Zucker“ ist für uns eine redaktionelle Grenze, kein gesetzliches Gesundheitsversprechen.':'Sugar from the label. Taste from real people. Our Hall of Fame requires ≤5 g sugar per 100 ml, ≥8/10 taste and verified absence of sweeteners.'}</p><p class="fz65-source">${s.lang==='de'?'Zum Nachlesen: Die gesetzliche EU-Angabe „zuckerarm“ bei Getränken gilt erst bis 2,5 g/100 ml.':'EU “low sugars” for drinks means ≤2.5 g/100 ml.'} <a href="https://eur-lex.europa.eu/eli/reg/2006/1924/oj/deu" rel="noopener noreferrer" target="_blank">${s.lang==='de'?'EU-Verordnung 1924/2006 ↗':'EU Regulation 1924/2006 ↗'}</a></p></div><div class="fz65-manifesto-final"><b>${s.lang==='de'?'WIR WOLLEN KEINE LANGWEILIGEREN DRINKS.':'WE DO NOT WANT BORING DRINKS.'}</b><h2>${s.lang==='de'?'WIR WOLLEN BESSERE.':'WE WANT BETTER ONES.'}</h2><button class="cta" data-nav="map">${s.lang==='de'?'DIE BEWERTUNGEN ANSEHEN':'EXPLORE THE RATINGS'} ↗</button></div></div>`}

   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw Error('Bildverarbeitung auf diesem Gerät nicht verfügbar.');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);

}

}return}
if(d.export){exportFile(d.export);return}if('import'in d){R.querySelector('#fizz-import')?.click();return}if(d.edititem){let target=s.items.find(x=>x.id===d.edititem);if(target){s.edit=JSON.parse(JSON.stringify(target));s.detail=null;nav('edit')}return}if(d.deleteitem){let target=s.items.find(x=>x.id===d.deleteitem);if(target&&confirm((s.lang==='de'?'Drink wirklich löschen? ':'Delete drink? ')+target.name)){const previous=s.items;s.items=s.items.filter(x=>x.id!==target.id);if(await persist()){nav('fridge');await crewOnLocalDelete(target)}else{s.items=previous}}return}if(d.nav){nav(d.nav);return}if(d.lang){s.lang=d.lang;try{localStorage.setItem('fizzmap.lang',s.lang)}catch(_){}if(nativeBridge())sendNative({type:'language',lang:s.lang});render(true);return}if(d.feature){nav(d.feature==='swap'?'swap':'manifesto');return}if(d.detail){s.detailFrom=s.tab;s.detail=d.detail;s.peek=null;render(false);return}if(d.point){s.peek=d.point;render(true);return}if('close' in d){s.peek=null;render(true);return}if(d.mode){s.mode=d.mode;s.peek=null;if(d.mode==='personal'&&crew.enabled&&!crew.members.some(m=>m.user_id===crew.user?.id&&m.active)){crew.gateOpen=true;crewRenderGate();return;}crew.gateOpen=false;render(true);return}if(d.filter){s.filter=d.filter;render(true);return}if('back'in d){s.detail=null;nav(s.detailFrom||'home');return}if('add'in d){s.catalogQuery='';s.edit={id:null,name:'',brand:'',maker:'',country:'',market:'',catalogId:'',productSource:'',verifiedSweetener:false,verificationSource:'',sharePhoto:false,cat:'Citrus',sugar:null,size:330,score:7.5,sweet:'unknown',bought:'',enjoyed:'',date:new Date().toISOString().slice(0,10),pack:'can',ratings:[8,8,8,8,8,8],tasted:true,art:null,communityPhoto:null,legacyPhotos:{},zoom:1,shift:0,penalty:0,note:''};nav('edit');return}if(d.pack){s.edit.pack=d.pack;render(true);return}if(d.set){let r=R.querySelector('#fz5-set');if(r)r.innerHTML=`<p class="muted" style="margin-top:12px">${sets.find(v=>v[0]===d.set)?.[1]} ${d.set} / +20 XP · R.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-point')){e.preventDefault();s.peek=e.target.dataset.point;render(true)}});

 else s.edit[k]=k==='tasted'||k==='verifiedSweetener'||k==='sharePhoto'?e.target.checked:['size','zoom','shift','penalty'].includes(k)?Number(e.target.value):e.target.value;if(k==='verifiedSweetener'){s.edit.verificationSource=e.target.checked?'ingredient_label_checked':''}if(k==='name'&&s.edit.catalogId){s.edit.catalogId='';s.edit.labelName='';s.edit.productSource=''}const l=R.querySelector(`[data-val="${k}"]`);if(l)l.textContent=e.target.value;if(k==='zoom'||k==='shift'){let p=R.querySelector('.detail-photo .vessel');if(p)p.style.setProperty(k==='zoom'?'--label-zoom':'--label-shift',e.target.value+(k==='shift'?'%':''))}if((k==='name'||k==='brand')&&!s.edit.art){let label=R.querySelector('.detail-photo .label-design');if(label)label.innerHTML=`<span class="label-brand">${esc(s.edit.brand||'SODA CULTURE')}</span><strong>${esc(s.edit.name||'NEW DROP')}</strong><span class="label-caption">FIZZMAP®</span>`}return}if(e.target.hasAttribute('data-rating')){const i=+e.target.dataset.rating;s.edit.ratings[i]=+e.target.value;R.querySelector(`[data-rating-label="${i}"]`).textContent=e.target.value;R.querySelector('#fz5-score').textContent=getScore().toFixed(1);return}if(e.target.hasAttribute('data-query')){let pos=e.target.selectionStart;s.q=e.target.value;render(true);let input=R.querySelector('[data-query]');input?.focus();try{input?.setSelectionRange(pos,pos)}catch(_){}return}});
R.addEventListener('change',async e=>{if(e.target.id==='fizz-import'&&e.target.files?.[0]){try{const txt=await e.target.files[0].text();await restoreData(JSON.parse(txt))}catch(err){toast('Import error: '+err.message)}e.target.value='';return}if(e.target.hasAttribute('data-sort')){s.sort=e.target.value;render(true);return}if(e.target.dataset.image){try{const kind=e.target.dataset.image;if(!['art','communityPhoto'].includes(kind))throw Error('Unbekannter Bildtyp');const photo=await readPhoto(e.target.files?.[0],kind);s.edit[kind]=photo;if(kind==='art'){const label=R.querySelector('.detail-photo .vessel-label');if(label)label.innerHTML='<img class="label-art" src="'+photo+'" alt="">'}else{render(true)}toast(s.lang==='de'?'Foto optimiert & übernommen ✓':'Image compressed & saved ✓')}catch(err){toast(err.message)}}});
